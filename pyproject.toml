[project]
name = "looper-rt"
dynamic = ["version"]
description = "The C runtime and control protocol schema of a looper simulation"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
docs = [
    "sphinx>=8.1",
    "furo>=2024.8.6",
    "myst-parser>=4.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/looper_rt"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["looper_rt"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RET", "D"]
ignore = ["D105", "D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "D100", "D101", "D102", "D103"]
